[workspace]
members = [
	"crates/vpe",
	"crates/vpe-cli",
	"crates/vpe-ffi",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["whitephoenixsoft"]

[workspace.dependencies]
serde = {version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
